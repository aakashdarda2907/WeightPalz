{% extends 'base.html' %}
{% block title %}Log in – WeightPalz{% endblock %}
{% block nav %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-box">
        <div class="auth-top">
      <a class="back" href="{% url 'landing' %}" aria-label="Back to home">‹ Back</a>
      <a class="logo auth-logo" href="{% url 'landing' %}">Weight<i>Palz</i></a>
    </div>
    <h2>Welcome back</h2>
    <p class="mut">Pick up where you left off.</p>

    <form method="post">
      {% csrf_token %}
      <input class="input" type="email" name="email" placeholder="Email" aria-label="Email"
             value="{{ form_email|default:'' }}" autocomplete="email" required>
      <input class="input" type="password" name="password" placeholder="Password" aria-label="Password"
             autocomplete="current-password" required>
      <button class="btn block" type="submit">Log in</button>
    </form>

    <p class="mut center">New here? <a class="link" href="{% url 'signup' %}">Sign up</a></p>
  </div>
  <p class="fine">Not medical advice.</p>
</div>
{% endblock %}
